openapi: 3.2.0
info:
  title: Locus Order Service Type Configuration API
  description: Manage your orders with the Locus OMS API
  version: 1.0.0
tags:
- name: ServiceTypeConfiguration
paths:
  /client/{clientId}/service-type/{serviceTypeId}/disable:
    parameters:
    - $ref: '#/components/parameters/ClientIdParam'
    - $ref: '#/components/parameters/ServiceTypeIdParam'
    post:
      description: Disable a specific service type
      operationId: disableServiceType
      tags:
      - ServiceTypeConfiguration
      responses:
        '200':
          description: Updated service type object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceTypeConfiguration'
      security:
      - locusauth: []
      summary: Disable service type
      x-summary-source: derived
components:
  schemas:
    EntityDefinition:
      type: object
    Amount:
      description: Amount of an item
      properties:
        amount:
          type: number
          format: double
        currency:
          type: string
          description: Currency for the amount. Value should be one of the active codes of official ISO 4217 currency names. Examples are INR, USD, AED, GBP etc
        symbol:
          type: string
          description: A symbol for the currency. If missing, will default to currency string
    ServiceSubType:
      type: string
      enum:
      - NO_OF_DAYS_PLUS_TIME
      - NO_OF_DAYS
      - NO_OF_DAYS_PLUS_SLOT
    ServiceTypeConfiguration:
      description: Service type model a specific delivery service
      allOf:
      - $ref: '#/components/schemas/CreateServiceTypeRequest'
      - type: object
    OrderType:
      $ref: https://swagger.locus-api.com/oms.yaml#/definitions/OrderType
    CreateServiceTypeRequest:
      description: Create service type
      allOf:
      - $ref: '#/components/schemas/EntityDefinition'
      - type: object
        required:
        - serviceTypeId
        - serviceTypeName
        - orderTypes
        - maxDeliveryDays
        - maxDeliveryTime
        properties:
          orderType:
            $ref: '#/components/schemas/OrderType'
          teams:
            description: List of teams of carrier client to consider for this task assignment
            type: array
            items:
              type: string
          serviceabilityMapIds:
            description: List of zone ids that the service is serviceable to
            type: array
            items:
              type: string
          maxDeliveryDays:
            type: integer
            minimum: 0
            description: Maximum number of days allowed to fulfill the delivery.
          maxDeliveryTime:
            type: string
            pattern: ^([01]\d|2[0-3]):([0-5]\d)$
            description: Latest time by which the delivery should be completed, in 24-hour HH:MM format.
            example: '23:00'
          costOfService:
            $ref: '#/components/schemas/Amount'
          serviceSubType:
            $ref: '#/components/schemas/ServiceSubType'
  parameters:
    ServiceTypeIdParam:
      name: serviceTypeId
      in: path
      description: Id of the service type
      required: true
      schema:
        type: string
    ClientIdParam:
      name: clientId
      in: path
      description: Id of the client
      required: true
      schema:
        type: string
  securitySchemes:
    locusauth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication
    apiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
