openapi: 3.2.0
info:
  title: Locus Rider Persona API
  description: Manage your deliveries with the Locus API
  version: 1.0.0
tags:
- name: RiderPersona
paths:
  /client/{clientId}/rider-persona/{riderPersonaId}:
    parameters:
    - $ref: '#/components/parameters/ClientIdParam'
    - $ref: '#/components/parameters/RiderPersonaIdParam'
    get:
      summary: Get a rider persona by id
      operationId: getRiderPersona
      parameters:
      - name: include
        in: query
        description: Comma separated list of extra fields that should be returned. Supported values are TRANSPORTER.
        required: false
        schema:
          type: string
      tags:
      - RiderPersona
      responses:
        '200':
          description: Desired rider persona
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiderPersona'
      security:
      - locusauth: []
    put:
      summary: Create a new rider persona
      operationId: createRiderPersona
      parameters:
      - $ref: '#/components/parameters/OverwriteParam'
      tags:
      - RiderPersona
      responses:
        '200':
          description: Created rider persona
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiderPersona'
      security:
      - locusauth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRiderPersonaRequest'
        description: Rider persona create request
        required: true
  /client/{clientId}/rider-persona/{riderPersonaId}/disable:
    parameters:
    - $ref: '#/components/parameters/ClientIdParam'
    - $ref: '#/components/parameters/RiderPersonaIdParam'
    post:
      description: Disable a specific rider persona
      operationId: disableRiderPersona
      tags:
      - RiderPersona
      responses:
        '200':
          description: Updated rider persona
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiderPersona'
      security:
      - locusauth: []
      summary: Disable rider persona
      x-summary-source: derived
components:
  parameters:
    OverwriteParam:
      name: overwrite
      in: query
      description: Boolean flag if true, will overwrite the existing entity
      required: false
      schema:
        type: boolean
    RiderPersonaIdParam:
      name: riderPersonaId
      in: path
      description: Id of the rider persona
      required: true
      schema:
        type: string
    ClientIdParam:
      name: clientId
      in: path
      description: Id of the client
      required: true
      schema:
        type: string
  schemas:
    CreateRiderPersonaRequest:
      description: Wrapper for rider persona create request
      allOf:
      - $ref: '#/components/schemas/RiderPersona'
      - type: object
    RiderPersona:
      $ref: https://swagger.locus-api.com/common-entities.yaml#/definitions/RiderPersona
  securitySchemes:
    locusauth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication
    apiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
