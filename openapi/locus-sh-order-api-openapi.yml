openapi: 3.2.0
info:
  title: Locus Order API
  description: Manage your orders with the Locus OMS API
  version: 1.0.0
tags:
- name: Order
paths:
  /client/{clientId}/order:
    parameters:
    - $ref: '#/components/parameters/ClientIdParam'
    get:
      summary: Get an order
      operationId: getOrderBySourceId
      parameters:
      - name: sourceOrderId
        in: query
        description: Source Id of the order
        required: true
        schema:
          type: string
      tags:
      - Order
      responses:
        '200':
          description: The latest order in terms of orderDate with the given sourceOrderId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
      security:
      - locusauth: []
  /client/{clientId}/order/{orderId}:
    parameters:
    - $ref: '#/components/parameters/ClientIdParam'
    - $ref: '#/components/parameters/OrderIdParam'
    get:
      summary: Get an order
      operationId: getOrder
      parameters:
      - name: include
        in: query
        description: Comma separated list of extra fields that should be included for the Order. Supported values are HOMEBASE & LOCATION
        required: false
        schema:
          type: string
      tags:
      - Order
      responses:
        '200':
          description: Requested Order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
      security:
      - locusauth: []
    put:
      summary: Create an order
      operationId: createOrder
      parameters:
      - name: suffix
        in: query
        description: Append given suffix to all orderIds, if provided
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/OverwriteParam'
      tags:
      - Order
      responses:
        '200':
          description: Created Order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
      security:
      - locusauth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
        description: Order create request
        required: true
  /client/{clientId}/order/{orderId}/park:
    parameters:
    - $ref: '#/components/parameters/ClientIdParam'
    - $ref: '#/components/parameters/OrderIdParam'
    put:
      description: Update status as parked for a single order
      operationId: parkOrder
      tags:
      - Order
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
      security:
      - locusauth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParkOrderRequest'
        description: park request
      summary: Park order
      x-summary-source: derived
  /client/{clientId}/order/{orderId}/cancel:
    parameters:
    - $ref: '#/components/parameters/ClientIdParam'
    - $ref: '#/components/parameters/OrderIdParam'
    put:
      description: Update status as cancelled for a single order
      operationId: cancelOrder
      tags:
      - Order
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
      security:
      - locusauth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrderRequest'
        description: cancel order request
      summary: Cancel order
      x-summary-source: derived
  /client/{clientId}/order/{orderId}/open:
    parameters:
    - $ref: '#/components/parameters/ClientIdParam'
    - $ref: '#/components/parameters/OrderIdParam'
    put:
      description: Update status as open for a single order
      operationId: openOrder
      tags:
      - Order
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
      security:
      - locusauth: []
      summary: Open order
      x-summary-source: derived
  /client/{clientId}/order/{orderId}/complete:
    parameters:
    - $ref: '#/components/parameters/ClientIdParam'
    - $ref: '#/components/parameters/OrderIdParam'
    put:
      description: Update the order status to COMPLETE
      operationId: completeOrder
      tags:
      - Order
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
      security:
      - locusauth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteOrderRequest'
        description: Complete order request
        required: true
      summary: Complete order
      x-summary-source: derived
  /client/{clientId}/order/{orderId}/reschedule:
    parameters:
    - $ref: '#/components/parameters/ClientIdParam'
    - $ref: '#/components/parameters/OrderIdParam'
    post:
      description: Reschedule the order for given date
      operationId: rescheduleOrder
      tags:
      - Order
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
      security:
      - locusauth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRescheduleRequest'
        description: Order reschedule request
        required: true
      summary: Reschedule order
      x-summary-source: derived
  /client/{clientId}/order/{orderId}/verify-inventory:
    parameters:
    - $ref: '#/components/parameters/ClientIdParam'
    - $ref: '#/components/parameters/OrderIdParam'
    put:
      summary: Inventory Verification
      operationId: verifyInventory
      tags:
      - Order
      responses:
        '200':
          description: Void response
      security:
      - locusauth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryVerificationRequest'
        required: true
components:
  schemas:
    ReasonCode:
      description: Reason Code Enum
      type: string
      enum:
      - UNALLOCATED_IN_PLAN
      - RESCHEDULED
      - CANCELLATION_REASON
      - DATA_ISSUE
      - NO_WORKFLOW_MATCHED
      - NO_DISPATCH_WAVE_MATCHED
      - ATTEMPTS_EXHAUSTED
      - REATTEMPTS_EXHAUSTED
      - PARK_ATTEMPTS_EXHAUSTED
      - RESCHEDULES_EXHAUSTED
      - DELIVERY_WINDOW_EXHAUSTED
      - QUOTE_NOT_FOUND
      - CARRIER_REJECTED
      - QUOTE_REJECTED
      - QUOTE_AUTO_ACCEPTED
      - QUOTE_ACCEPTED_BY_USER
      - NO_SLOTS_AVAILABLE
      - GEOCODING_ERROR
      - PARKED
      - AUTOSORT_ERROR
      - CAPACITY_EXCEEDED
    PodChecklistVerificationResult:
      properties:
        podVerificationStatus:
          description: Status of the POD verification result
          $ref: '#/components/schemas/PodVerificationStatusEnum'
        podVerificationResult:
          description: A map of POD verification results with checklist item id and result
          type: object
          additionalProperties:
            $ref: '#/components/schemas/PodVerificationResult'
    PromiseTimelineElement:
      properties:
        serviceTypeId:
          type: string
        dateSlots:
          type: array
          items:
            $ref: '#/components/schemas/DateSlotInfoElement'
        timestamp:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/Actor'
        reason:
          $ref: '#/components/schemas/Reason'
    GeocodingConfidence:
      $ref: https://swagger.locus-api.com/geocoding.yaml#/definitions/GeocodingConfidence
    OrderStatus:
      description: Order status enum
      type: string
      enum:
      - OPEN
      - CONFIRMED
      - PLANNING
      - PLANNED
      - ASSIGNED
      - EXECUTING
      - COMPLETED
      - CANCELLED
      - PARKED
      - RECEIVED
    FulfillmentMode:
      description: Channel through which the Order is fulfilled
      type: string
      enum:
      - DISPATCH_IQ
      - TRACK_IQ
      - ORCHESTRATION_IQ
      - TOUR_DISPATCH_MANAGEMENT
    ContractCostMetadata:
      properties:
        contractId:
          $ref: '#/components/schemas/ContractId'
        status:
          $ref: '#/components/schemas/OrderCostEnum'
        totalCost:
          description: Total cost for the given request
          type: number
          format: double
        costBreakup:
          type: array
          items:
            $ref: '#/components/schemas/BaseCostBreakup'
    ProviderInstrumentId:
      description: Id of the payment instrument as identified by a provider
      required:
      - providerId
      - instrumentId
      properties:
        providerId:
          description: Id of payment instrument provider. For eg, razor-pay for RazorPay instruments. This should be one of the supported values.
          type: string
        instrumentId:
          description: Id of the payment instrument as identified by the provider.
          type: string
    PaymentChecklistItems:
      properties:
        skipPaymentChecklist:
          type: array
          items:
            $ref: '#/components/schemas/ChecklistItem'
        partialPaymentChecklist:
          type: array
          items:
            $ref: '#/components/schemas/ChecklistItem'
        fullPaymentChecklist:
          type: array
          items:
            $ref: '#/components/schemas/ChecklistItem'
    OrchestrationShipmentMetadata:
      properties:
        carrierId:
          type: string
        serviceType:
          type: string
        orchestrationStatus:
          $ref: '#/components/schemas/OrchestrationStatus'
        shipmentRateDetail:
          $ref: '#/components/schemas/ShipmentRateDetail'
        waybills:
          type: array
          items:
            $ref: '#/components/schemas/OrchestrationWaybillMetadata'
    CompleteOrderRequest:
      description: Order complete request
      properties:
        orderId:
          type: string
        timestamp:
          type: string
          format: date-time
        homebaseTimestamp:
          type: string
          format: date-time
        lineItems:
          type: array
          items:
            $ref: '#/components/schemas/LineItemTransactionStatus'
        customerTransactionStatus:
          $ref: '#/components/schemas/TransactionDetail'
        homebaseTransactionStatus:
          $ref: '#/components/schemas/TransactionDetail'
        isSoftComplete:
          type: boolean
          description: Flag to denote if completion of order to be treated as soft or hard
          default: false
    InventoryVerificationRequest:
      description: Inventory Verification Request
      required:
      - isInventoryVerified
      properties:
        isInventoryVerified:
          type: boolean
        verifyAt:
          type: string
          format: date-time
    Payments:
      description: Container for all payment related info
      required:
      - totalAmount
      - pendingAmount
      - fullAmountRequired
      - paymentRequired
      properties:
        totalAmount:
          $ref: '#/components/schemas/Amount'
        pendingAmount:
          $ref: '#/components/schemas/Amount'
        payments:
          description: All payments associated with this. Can be in any status - successful, failed, pending etc.
          type: array
          items:
            $ref: '#/components/schemas/Payment'
        fullAmountRequired:
          type: boolean
          default: false
          description: Boolean to denote that full payment amount is required before completing the task.
        paymentRequired:
          type: boolean
          description: Boolean to denote that payments are supposed to be present here
    AmountDetailsTimeline:
      description: Maintains a chronological log of amount updates with details
      properties:
        amount:
          $ref: '#/components/schemas/AmountDetails'
        exchangeType:
          $ref: '#/components/schemas/AmountExchangeType'
        actor:
          $ref: '#/components/schemas/Actor'
        amountType:
          $ref: '#/components/schemas/AmountType'
        timestamp:
          type: string
          format: date-time
    Amount:
      description: Amount of an item
      properties:
        amount:
          type: number
          format: double
        currency:
          type: string
          description: Currency for the amount. Value should be one of the active codes of official ISO 4217 currency names. Examples are INR, USD, AED, GBP etc
        symbol:
          type: string
          description: A symbol for the currency. If missing, will default to currency string
    CreateLineItemDetails:
      $ref: https://swagger.locus-api.com/oms.yaml#/definitions/CreateLineItemDetails
    OrderFreightCostMetadata:
      properties:
        freightCost:
          $ref: '#/components/schemas/FreightCost'
    WeightUnit:
      description: Unit for weight
      type: string
      enum:
      - MG
      - G
      - KG
      - T
      - OZ
      - LB
    OrderCostEnum:
      description: Status based on contract calculation. Possible values DISABLED, CONTRACT_MISSING, CALCULATION_FAILURE, AVAILABLE
      type: string
      enum:
      - DISABLED
      - CONTRACT_MISSING
      - CALCULATION_FAILURE
      - AVAILABLE
    CancelOrderRequest:
      properties:
        reason:
          $ref: '#/components/schemas/Reason'
    BaseTransactionStatus:
      required:
      - triggerTime
      - transactedQuantity
      - checklistValues
      properties:
        orderedQuantity:
          description: Quantity of the item that has been ordered
          type: integer
          format: int32
        transactedQuantity:
          description: Quantity of the item that has been transacted
          type: integer
          format: int32
        checklistValues:
          $ref: '#/components/schemas/Checklist'
        triggerTime:
          description: Time when the transaction status update was triggered on the client side
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/Actor'
        status:
          $ref: '#/components/schemas/OrderDetailStatusEnum'
    OrderGeocodedLocation:
      properties:
        city:
          type: string
        state:
          type: string
    BaseLineItemTransactionStatus:
      description: Transaction status of a line item
      properties:
        id:
          type: string
          description: id of the line item
        reconcileQuantity:
          type: integer
          format: int32
          default: 0
        handlingUnit:
          $ref: '#/components/schemas/HandlingUnitEnum'
    MinimalAutosortRoute:
      type: object
    Actor:
      type: object
    AutoSortDetails:
      description: details containing the route
      properties:
        route:
          description: Route for given order
          $ref: '#/components/schemas/MinimalAutosortRoute'
        versionedMapIds:
          type: array
          items:
            $ref: '#/components/schemas/VersionedMapId'
        autosortId:
          description: Id of the auto sort request
          type: string
    AmountDetails:
      description: It represents all amount components.
      properties:
        id:
          type: string
        grossAmount:
          description: Total unadjusted amount
          $ref: '#/components/schemas/Amount'
        netAmount:
          description: Adjusted amount after discounts or taxes
          $ref: '#/components/schemas/Amount'
        amountToBeCollected:
          description: The actual amount to be collected from the customer
          $ref: '#/components/schemas/Amount'
    PaymentStatus:
      description: Status of the payment
      type: string
      enum:
      - PENDING
      - SUCCESS
      - FAILED
      - CANCELLED
    RescheduleRequest:
      properties:
        rescheduleDate:
          type: string
          description: The date for which order is to be rescheduled. It should be ISO Date. eg. 2017-09-14
        rescheduleSlot:
          $ref: '#/components/schemas/TimeSlot'
        reason:
          $ref: '#/components/schemas/Reason'
        slotId:
          type: string
    TourFreightCostMetadata:
      properties:
        freightCost:
          $ref: '#/components/schemas/FreightCost'
        source:
          $ref: '#/components/schemas/FreightCostSource'
        contractId:
          type: string
    LocationSource:
      description: location provider source.
      type: string
      enum:
      - LOCATION_MASTER
    TrackingInfo:
      description: Tracking info
      properties:
        link:
          description: Url of the tracking link
          type: string
    Quantity:
      description: Quantity of items
      required:
      - value
      - unit
      properties:
        value:
          description: Quantity of the item in the given unit.
          type: integer
          format: int32
        unit:
          type: string
    ExtendedStructuredAddress:
      allOf:
      - $ref: '#/components/schemas/StructuredAddress'
      - type: object
        properties:
          type:
            $ref: '#/components/schemas/LocationType'
          customProperties:
            type: object
            additionalProperties:
              type: string
    CreatePromiseInformationRequest:
      properties:
        serviceTypeId:
          type: string
    MinimalLineItem:
      description: A single item contained in the order
      required:
      - name
      - quantity
      properties:
        id:
          description: An identifier for the SKU. If provided, details related to line item will be populated using sku master of the client
          type: string
        lineItemId:
          description: An identifier for the line item.
          type: string
        skuId:
          description: An identifier for the line item.
          type: string
        packId:
          description: A unique identifier of the line item, this is different from sku id. This would be unique across orders and only one qunatity of line item can exist with this id.
          type: string
        name:
          description: Name of the item
          type: string
        description:
          description: description of the item
          type: string
        handlingUnit:
          $ref: '#/components/schemas/HandlingUnitEnum'
          default: QUANTITY
        quantity:
          description: Quantity of the item
          type: integer
          format: int32
          default: 0
        quantityUnit:
          type: string
        price:
          $ref: '#/components/schemas/Amount'
        commodityCode:
          $ref: '#/components/schemas/TransitCode'
        parts:
          type: array
          items:
            $ref: '#/components/schemas/LineItemPart'
        customProperties:
          description: Additional properties which clients wants to have along with standard entity properties
          type: object
          additionalProperties:
            type: string
        summary:
          description: Summarized data of all line item parts
          $ref: '#/components/schemas/LineItemSummary'
        totalVolume:
          description: total volume of the line item multiplied by it's quantity
          $ref: '#/components/schemas/Volume'
        totalWeight:
          description: total weight of the line item multiplied by it's quantity
          $ref: '#/components/schemas/Weight'
        handlingUnits:
          type: array
          items:
            $ref: '#/components/schemas/HandlingUnitEnum'
        boxDetailSummary:
          $ref: '#/components/schemas/BoxDetailSummary'
        canRiderEdit:
          description: flag to denote whether the rider is allowed to edit the line item
          type: boolean
          default: true
    GeocodingMetadata:
      description: Metadata for geocoding of the address
      properties:
        provider:
          $ref: '#/components/schemas/GeocodingProvider'
        latLng:
          description: Optional location coordinates
          $ref: '#/components/schemas/MinimalLatLng'
        accuracy:
          type: integer
          format: int32
          default: 0
        confidence:
          $ref: '#/components/schemas/GeocodingConfidence'
        verified:
          description: Boolean to denote whether the geocoding is verified or not
          type: boolean
          default: false
        requestId:
          description: Id for the stored geocode request
          type: string
        isCentroidResponse:
          description: Denotes if the response is centroid response of any kind
          type: boolean
          default: false
        responseSource:
          $ref: '#/components/schemas/ResponseSource'
    TransactionStatus:
      allOf:
      - $ref: '#/components/schemas/BaseTransactionStatus'
      - type: object
        properties:
          orderedWeight:
            description: Weight of the item that has been ordered
            $ref: '#/components/schemas/Weight'
          transactedWeight:
            description: Weight of the item that has been transacted
            $ref: '#/components/schemas/Weight'
          orderedVolume:
            description: Volume of the item that has been ordered
            $ref: '#/components/schemas/Volume'
          transactedVolume:
            description: Volume of the item that has been transacted
            $ref: '#/components/schemas/Volume'
    AmountTransaction:
      description: Transaction of an amount.
      properties:
        refId:
          description: id of amount transaction
          type: string
        amount:
          $ref: '#/components/schemas/Amount'
        net:
          $ref: '#/components/schemas/BaseAmount'
        gross:
          $ref: '#/components/schemas/BaseAmount'
        exchangeType:
          description: Type of transaction.
          type: string
          enum:
          - COLLECT
          - GIVE
          - NONE
    MinimalContactPoint:
      description: Contact point at a visit location.
      properties:
        name:
          description: Name of contact
          type: string
        number:
          description: Number for contact person
          type: string
        alternateNumber:
          description: Alternate number for contact person
          type: string
        email:
          description: Email of contact person
          type: string
        language:
          description: Preferred communication language
          type: string
          default: en-US
    OrchestrationWaybillMetadata:
      properties:
        lineItemId:
          type: string
        waybillId:
          type: string
        waybillNumber:
          type: string
    BaseCostBreakup:
      type: object
    DistributionChannel:
      type: string
      enum:
      - TRACK_IQ
      - SHIPFLEX
      - TOUR_DISPATCH_MANAGEMENT
      - OIQ
    OrderDetailStatusEnum:
      type: string
      enum:
      - DELIVERED
      - NOT_DELIVERED
      - PARTIALLY_DELIVERED
    LineItemDetails:
      $ref: https://swagger.locus-api.com/oms.yaml#/definitions/LineItemDetails
    OrderSubStatus:
      description: Order sub status enum
      type: string
      enum:
      - PENDING_ACCEPTANCE
      - ACCEPTED
      - PICKUP_ENROUTE
      - SERVICE_ENROUTE
      - PICKUP_REACHED
      - SERVICE_REACHED
      - PICKUP_ONGOING
      - SERVICE_ONGOING
      - PICKUP_DONE
      - DROP_ENROUTE
      - DROP_REACHED
      - DROP_ONGOING
      - DROP_DONE
      - ATTEMPT_FAILED
      - INBOUND_PENDING
      - INBOUND_COMPLETED
      - TOUR_STARTED
      - IN_TRANSIT
      - PARTIALLY_COMPLETED
      - OUTBOUND_COMPLETED
    ParkOrderRequest:
      properties:
        reason:
          $ref: '#/components/schemas/Reason'
    OrderStatusUpdate:
      description: Merge patch request wrapper
      properties:
        channel:
          $ref: '#/components/schemas/FulfillmentChannel'
        orderStatus:
          $ref: '#/components/schemas/OrderStatus'
        orderSubStatus:
          $ref: '#/components/schemas/OrderSubStatus'
        orderMetadata:
          $ref: '#/components/schemas/OrderMetadata'
        updatedBy:
          type: string
        updatedOn:
          type: string
          format: date-time
    TransactionDetail:
      $ref: https://swagger.locus-api.com/oms.yaml#/definitions/TransactionDetail
    OmsDimensions:
      description: Dimensions of an item
      properties:
        length:
          description: Length of the item in meters
          type: number
          format: double
        breadth:
          description: Breadth of the item in meters
          type: number
          format: double
        height:
          description: Height of the item in meters
          type: number
          format: double
        unit:
          $ref: '#/components/schemas/LengthUnit'
    PaymentInstrument:
      description: A method of payment
      required:
      - instrumentType
      - instrumentName
      properties:
        instrumentType:
          $ref: '#/components/schemas/PaymentInstrumentType'
        instrumentName:
          description: A human friendly name for the payment instrument
          type: string
        providerInstrumentId:
          $ref: '#/components/schemas/ProviderInstrumentId'
    StructuredAddress:
      description: A real world address
      properties:
        id:
          description: An id for the address
          type: string
        placeName:
          description: Name of the place
          type: string
        localityName:
          description: Name of the locality if available
          type: string
        formattedAddress:
          description: Text representation of the address.
          type: string
        subLocalityName:
          description: Name of the sub-locality if available
          type: string
        pincode:
          description: Zipcode for the address
          type: string
        city:
          description: City of the address
          type: string
        state:
          description: State of the address
          type: string
        countryCode:
          description: Country code to uniquely identify the country
          type: string
        locationType:
          description: Possible values currently are STANDALONE_APARTMENT, GATED_COMMUNITY, INDEPENDENT_PREMISES
          type: string
        placeHash:
          description: Hashed value of placeName for internal use
          type: string
        locationSource:
          $ref: '#/components/schemas/LocationSource'
        locationName:
          description: Location name to be populated from location entity
          type: string
    AmountType:
      description: Payment status of an order.
      type: string
      enum:
      - CURRENT
      - EXECUTED
    ResponseSource:
      $ref: https://swagger.locus-api.com/geocoding.yaml#/definitions/ResponseSource
    OrderVisitDetails:
      description: visit related details by statuses
      properties:
        homebaseStartedBy:
          type: string
        homebaseStartedAt:
          type: string
          format: date-time
        homebaseReachedBy:
          type: string
        homebaseReachedAt:
          type: string
          format: date-time
        homebaseTransactingBy:
          type: string
        homebaseTransactingAt:
          type: string
          format: date-time
        homebaseCompletedBy:
          type: string
        homebaseCompletedOn:
          type: string
          format: date-time
        homebaseCancelledBy:
          type: string
        homebaseCancelledAt:
          type: string
          format: date-time
        customerVisitStartedBy:
          type: string
        customerVisitStartedAt:
          type: string
        customerVisitReachedBy:
          type: string
        customerVisitReachedAt:
          type: string
        customerVisitTransactingBy:
          type: string
        customerVisitTransactingAt:
          type: string
          format: date-time
        customerVisitCompletedBy:
          type: string
        customerVisitCompletedAt:
          type: string
